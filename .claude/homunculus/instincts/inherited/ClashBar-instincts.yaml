# ClashBar Workflow Feature Or Refactor Menu Bar Tabs

## Action

Follow the feature-or-refactor-menu-bar-tabs workflow:
1. Edit or add files in Sources/ClashBar/Features/MenuBar/Tabs/* (such as ActivityTabView.swift, ProxyProvidersAndGroupsView.swift, SystemTabView.swift, etc.)
2. Update shared menu bar components in Sources/ClashBar/Features/MenuBar/Components/* or layout helpers in Sources/ClashBar/Features/MenuBar/Layout/*
